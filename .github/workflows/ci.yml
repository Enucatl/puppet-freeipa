name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.3']
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake validate lint spec
      - run: bundle exec rubocop

  acceptance:
    if: ${{ vars.FREEIPA_ACCEPTANCE == 'true' && vars.FREEIPA_ACCEPTANCE_COMMAND != '' }}
    runs-on: [self-hosted, freeipa-acceptance]
    env:
      FREEIPA_ACCEPTANCE_COMMAND: ${{ vars.FREEIPA_ACCEPTANCE_COMMAND }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec rake acceptance
